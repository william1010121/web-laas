<!doctype html>
<!-- Formulas rendered over their source in five kinds of editors. -->
<html><head><meta charset="utf-8"><title>inline render</title>
<link rel="stylesheet" href="dist/inline-render.css">
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 40px; background: #f7f7f5; color: #222; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  h2 { font-size: 14px; margin: 0 0 6px; color: #666; }
  .cm-editor, .CodeMirror, textarea, #ce, #pm .ProseMirror { background: #fff; border: 1px solid #ccc; border-radius: 6px; }
  .cm-editor { height: 300px; } .CodeMirror { height: 300px; font: 13px/1.5 ui-monospace, Menlo, monospace; }
  textarea { box-sizing: border-box; width: 100%; height: 300px; font: 13px/1.5 ui-monospace, Menlo, monospace; padding: 8px; }
  #ce, #pm .ProseMirror { padding: 8px; height: 300px; overflow: auto; white-space: pre-wrap; }
  #pm p { margin: 0; }
</style></head>
<body>
<div class="grid">
  <div><h2>CodeMirror 6 (Overleaf)</h2><div id="cm6"></div></div>
  <div><h2>CodeMirror 5 (HackMD)</h2><div id="cm5"></div></div>
  <div><h2>textarea</h2><textarea id="ta" spellcheck="false"></textarea></div>
  <div><h2>contenteditable (Notion)</h2><div id="ce" contenteditable="true" spellcheck="false"></div></div>
  <div><h2>ProseMirror (ChatGPT / Claude)</h2><div id="pm"></div></div>
  <div><h2>dialog (own stacking, scaled to 85%) with a popup over a formula</h2>
    <div id="dlg" style="position:relative;z-index:5;transform:scale(0.85);transform-origin:0 0;background:#fff;border:1px solid #ccc;border-radius:6px;padding:8px">
      <textarea id="ta2" spellcheck="false" style="height:80px;border:0">Inside a dialog: $\frac{a}{b}$ and $x^2 + y^2$ here.</textarea>
      <div style="position:absolute;z-index:10;left:150px;top:4px;background:#fffbe0;border:1px solid #d8c76a;padding:4px 8px;border-radius:4px">popup on top</div>
    </div>
  </div>
  <div style="height:150px"><h2>textarea scaled 1.4× itself</h2><textarea spellcheck="false" style="box-sizing:border-box;width:70%;height:60px;font:13px/1.5 ui-monospace,Menlo,monospace;padding:6px;border:1px solid #ccc;border-radius:6px;transform:scale(1.4);transform-origin:0 0">Scaled: $\sqrt{x} + \frac{1}{2}$ ok.</textarea></div>
  <div><h2>textarea in an open shadow root</h2><div id="shadow-host" style="position:relative;z-index:2"></div></div>
  <div><h2>input</h2><input id="in" spellcheck="false" style="box-sizing:border-box;width:100%;height:44px;padding:0 10px;font:15px system-ui;border:1px solid #ccc;border-radius:6px" value="Search for $\sum_{k=1}^n k^2$ and $e^{i\pi}$ here"></div>
</div>
<script src="dist/inline-render.js"></script>
</body></html>
