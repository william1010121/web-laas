<!doctype html>
<!-- Benchmark: typing on a long chat page. ?turns=150&parts=engine,inline,messages,live; keyLatency(), stream(ms). -->
<html><head><meta charset="utf-8"><title>chat typing bench</title>
<style>
  body { font: 16px/1.6 system-ui, sans-serif; margin: 0; background: #fff; color: #222; display: flex; flex-direction: column; height: 100vh; }
  #thread { flex: 1; overflow: auto; padding: 0 20%; }
  #prompt { margin: 8px 20%; border: 1px solid #ccc; border-radius: 16px; padding: 10px 14px; max-height: 200px; overflow: auto; }
  #prompt .ProseMirror { outline: none; white-space: pre-wrap; min-height: 1.6em; }
  #prompt p { margin: 0; }
</style></head>
<body><div id="thread"></div><div id="prompt"></div><script src="dist/chat-bench.js"></script></body></html>
