<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  body { width: 360px; background: var(--bg); }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .head .name { font-weight: 650; }
  .head .sub { color: var(--muted); font-size: 12px; }
  .head .text { flex: 1; }
  .wrap { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { padding: 12px 14px; }
  .host { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .actions .btn { justify-content: center; padding: 10px 12px; }
  .off .row.site, .off .delims { opacity: .5; }
  .delims .row { padding: 10px 14px; flex-wrap: wrap; gap: 6px 10px; }
  .delims .head2 { padding: 10px 14px 0; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .delims .row + .row { border-top: 0; padding-top: 2px; }
  .delims .title { width: 26px; font-family: var(--mono); font-size: 12.5px; }
  .delims[hidden] { display: none; }
</style>
</head>
<body>
  <div class="head">
    <span class="logo">∑</span>
    <div class="text">
      <div class="name">LaTeX Anywhere</div>
      <div class="sub" id="sub">Auto-expanding LaTeX snippets</div>
    </div>
    <label class="switch" title="On / off everywhere (Alt+Shift+L)"><input type="checkbox" id="enabled"><span></span></label>
  </div>
  <div class="wrap">
    <div class="card">
      <label class="row site">
        <div class="text">
          <div class="title">On for this site</div>
          <div class="host" id="host"></div>
        </div>
        <span class="switch"><input type="checkbox" id="site"><span></span></span>
      </label>
    </div>
    <div class="card delims" id="delims" hidden>
      <div class="head2"><span>What mk / dm insert on this site</span></div>
      <div class="row"><span class="title">mk</span><div class="seg" id="inline" role="group" aria-label="mk inline math"></div></div>
      <div class="row"><span class="title">dm</span><div class="seg" id="display" role="group" aria-label="dm display math"></div></div>
    </div>
    <div class="actions">
      <button class="btn" id="cheatsheet">∑ Cheat sheet <kbd id="csKey">Alt+Shift+K</kbd></button>
      <button class="btn secondary" id="options" title="Settings">Settings</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
